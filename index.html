<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F5F4F0"><title>David Chauke | IT Professional</title><style>html,body{margin:0;min-height:100%;background:#F5F4F0;font-family:Arial,sans-serif}.loader{min-height:100vh;display:grid;place-items:center;color:#15171B}.box{font-size:13px;letter-spacing:.04em}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4C8B5A;margin-right:8px;animation:p 1s infinite}@keyframes p{50%{opacity:.25}}</style></head><body><div class="loader"><div class="box"><span class="dot"></span>Loading David Chauke portfolio…</div></div><script>(async()=>{try{const files=[1,2,3,4,5,6].map(n=>'assets/site-part-'+n+'.txt');const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div class="loader"><div class="box">Portfolio temporarily unavailable. Please refresh.</div></div>'}})();</script></body></html>
