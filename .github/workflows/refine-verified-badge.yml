name: Refine verified badge

on:
  push:
    paths:
      - '.github/workflows/refine-verified-badge.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update verified badge styling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          new_css = r'''.verify-status{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:7px 11px;border-radius:9px;font-size:.64rem;font-weight:800;letter-spacing:.045em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#050505 0%,#111 42%,#2a211c 72%,#080808 100%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 8px 20px rgba(0,0,0,.15)}.verify-status:before{content:"✓";display:grid;place-items:center;width:17px;height:17px;border-radius:5px;background:linear-gradient(135deg,#70482f,#a97652);color:#fff;font-size:.68rem;font-weight:900;box-shadow:inset 0 1px 0 rgba(255,255,255,.26)}'''
          s, n = re.subn(r'\.verify-status\{[^}]*\}', new_css, s, count=1)
          s = s.replace('>Official route ✓</span>', '>Verified</span>')
          s = s.replace('>Verified ✓</span>', '>Verified</span>')
          p.write_text(s)
          print('css replacements:', n)
          PY
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Refine credential verification badges'
            git push
          fi
